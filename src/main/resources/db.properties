# ============================================================================
# Campus Infrastructure Fault Reporting System - Database Configuration
# ============================================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/campus_fault_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root

# Connection Pool / Timeout Settings
db.initialSize=5
db.maxTotal=20
db.maxIdle=10
db.minIdle=5
db.maxWaitMillis=10000

# File Upload Directory (Relative to application root or absolute path)
upload.directory=uploads
upload.maxFileSize=10485760
upload.maxRequestSize=20971520
